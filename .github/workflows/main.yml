name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-csm:
    # Run this on windows
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # The version string
      - name: Set Version Environment Variable
        id: csm_version
        run: |
          "version=$(date +'%y%m').${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      # Update the assembly version to match the csm version
      - name: Update Assembly Version
        run: powershell.exe -NoP -NonI -Command "../scripts/update-version.ps1 -filePattern AssemblyInfo.cs -assemblyVersion ${{ steps.csm_version.outputs.version }}.0.0 -assemblyFileVersion ${{ steps.csm_version.outputs.version }}.0.0"
        working-directory: src

      # Download the assemblies required to build the mod
      - name: Download Assemblies
        uses: carlosperate/download-file-action@v2
        with:
          file-url: https://storage.citiesskylinesmultiplayer.com/Assemblies.zip
          # New filename to rename the downloaded file
          file-name: Assemblies.zip

      # Extract these assemblies
      - name: Extract Assemblies
        run: powershell.exe -NoP -NonI -Command "Expand-Archive 'Assemblies.zip' 'assemblies'"

      # Build the mod using the built in build script
      - name: Build Mod
        run: powershell.exe -NoP -NonI -Command "../scripts/build.ps1 -Build"
        working-directory: src

      # Copy output to common folder
      - name: Copy DLLs
        run: powershell.exe -NoP -NonI -Command "New-Item -ItemType directory -Path 'output'; Copy-Item './src/csm/bin/Release/*.dll','scripts/install.ps1' 'output'"

      # Publish artifacts
      - name: Upload mod DLLs
        uses: actions/upload-artifact@v4
        with:
          name: CSM ${{ steps.csm_version.outputs.version }}
          path: "output/*"

      # Pack API package (Nuget)
      - name: Build nuget API package
        if: github.ref == 'refs/heads/master'
        working-directory: src/api
        run: nuget pack -Properties Configuration=Release -NonInteractive

      # Publish API package (Nuget) — only if secret is configured
      - name: Publish API package
        if: github.ref == 'refs/heads/master'
        working-directory: src/api
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.NUGET_API_KEY }}")) {
            Write-Host "Skipping NuGet publish — NUGET_API_KEY not configured"
          } else {
            nuget push CitiesSkylinesMultiplayer.API.${{ steps.csm_version.outputs.version }}.0.nupkg ${{ secrets.NUGET_API_KEY }} -NonInteractive -Source https://api.nuget.org/v3/index.json
          }

      # Create GitHub Release on tag push
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CSM ${{ steps.csm_version.outputs.version }}
          files: output/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gs:
    # Run this on linux so it builds the correct docker image
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/apiserver
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: src/gs
          load: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Save docker image
        run: |
          IMAGE=$(echo "${{ steps.docker_meta.outputs.tags }}" | head -1)
          docker save -o apiserver.tar "$IMAGE"

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: src/gs
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: API Server Docker Image
          path: apiserver.tar
